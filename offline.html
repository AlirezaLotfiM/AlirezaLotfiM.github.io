<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>عدم دسترسی به اینترنت | علیرضا لطفی مقدم</title>
    <style>
      @font-face {
        font-family: "Peyda";
        src: url("https://portfolio-data.alirezalotfimoghaddam.ir/Fonts/PeydaWebVF.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      :root {
        color-scheme: light dark;
        --bg-gradient: radial-gradient(circle at top, rgba(255, 255, 255, 0.95), transparent 30%),
          linear-gradient(145deg, #e2e8f0 0%, #f8fafc 45%, #cbd5e1 100%);
        --card-bg: rgba(255, 255, 255, 0.85);
        --card-border: rgba(203, 213, 225, 0.8);
        --card-shadow: 0 20px 48px rgba(15, 23, 42, 0.08);
        --text-main: #0f172a;
        --text-muted: #475569;
        --btn-bg: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
        --btn-shadow: 0 4px 16px rgba(79, 70, 229, 0.3);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-gradient: radial-gradient(circle at top, rgba(79, 70, 229, 0.12), transparent 40%),
            linear-gradient(145deg, #090d16 0%, #0f172a 50%, #030712 100%);
          --card-bg: rgba(15, 23, 42, 0.85);
          --card-border: rgba(255, 255, 255, 0.08);
          --card-shadow: 0 20px 48px rgba(0, 0, 0, 0.5);
          --text-main: #f8fafc;
          --text-muted: #94a3b8;
          --btn-bg: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
          --btn-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Peyda", system-ui, -apple-system, sans-serif;
        background: var(--bg-gradient);
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .offline-card {
        width: min(100%, 460px);
        padding: 36px 28px;
        border-radius: 24px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        box-shadow: var(--card-shadow);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        text-align: center;
      }

      .offline-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.76rem;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 999px;
        background: rgba(239, 68, 68, 0.1);
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.25);
        margin-bottom: 14px;
      }

      .pulse-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #ef4444;
        animation: pulse 1.5s infinite;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.45rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 24px;
        font-size: 0.94rem;
        line-height: 1.85;
        color: var(--text-muted);
      }

      .retry-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        max-width: 240px;
        border: none;
        border-radius: 12px;
        padding: 12px 20px;
        background: var(--btn-bg);
        color: #ffffff;
        font-family: inherit;
        font-size: 0.92rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: var(--btn-shadow);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .retry-btn:hover {
        transform: translateY(-2px);
      }

      .retry-btn:active {
        transform: translateY(0);
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1.3); }
      }
    </style>
  </head>
  <body>
    <main class="offline-card">
      <div class="offline-badge">
        <span class="pulse-dot"></span>
        حالت آفلاین
      </div>
      <h1>الان آفلاین هستی</h1>
      <p>اتصال اینترنت برقرار نیست. به محض برگشتن اینترنت، نسخه جدید سایت دوباره بارگذاری می‌شود.</p>
      <button type="button" class="retry-btn" onclick="location.reload()">
        <span>تلاش دوباره</span>
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
        </svg>
      </button>
    </main>
  </body>
</html>
